version: '3.8'

services:
  app:
    build: .
    container_name: multimodal_food_agent
    ports:
      - "7860:7860"
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY:-DEMO_KEY}
      - HOST=0.0.0.0
      - PORT=7860
      - FASTAPI_PORT=8000
    volumes:
      - .:/app
    restart: unless-stopped
